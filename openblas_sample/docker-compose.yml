services:
  opensdk:
    image: opensdk:${SDK_VER}
    container_name : ${APP_NAME}
    environment:
      - SOC=${SOC}
      - APP_NAME=${APP_NAME}
      - CLEAN_OPENBLAS=${CLEAN_OPENBLAS:-OFF}
    volumes:
      - ./:/opt/${APP_NAME}
    working_dir: /opt/${APP_NAME}
    entrypoint: >
      /bin/bash -c 'source /opt/opensdk/common/set_toolchain.sh "$SOC" && exec "$@"' bash
    command: >
      /bin/bash -c "
      cd /opt/${APP_NAME}/app/ &&
      mkdir -p build &&
      cd build &&
      cmake -DSOC=${SOC} .. &&
      make clean && make && make install &&
      cd /opt/${APP_NAME} &&
      opensdk_packager -s ${SOC}
      "
