# Run repository-wide static checks without requiring the OpenSDK image.
name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-lint:
    name: JSON, YAML, Python, and C++ checks
    runs-on:
      group: opensdk-runner-groups
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate JSON and YAML syntax
        run: python scripts/ci/check_syntax.py

      - name: Check Python syntax
        run: python -m compileall -q python_based_component_and_event/app/src/python_component scripts/ci

      - name: Lint Python files
        run: ruff check python_based_component_and_event/app/src/python_component scripts/ci

      - name: Check changed-file whitespace and C++ formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$BASE_SHA"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="$(git rev-list --max-count=1 "$HEAD_SHA^1" 2>/dev/null || true)"
          fi

          if [ -z "$base_sha" ]; then
            echo "No base commit available; checking the current tree only."
            git diff --check
            exit 0
          fi

          git diff --check "$base_sha" "$HEAD_SHA"

          cpp_files="$(git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')"

          if [ -z "$cpp_files" ]; then
            echo "No changed C/C++ files to format-check."
            exit 0
          fi

          while IFS= read -r file; do
            echo "Checking C/C++ formatting: $file"
            clang-format --dry-run --Werror --style=file "$file"
          done <<< "$cpp_files"
